<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advertisement</title>
  <!--
    [GREY FEATURE WARNING]: Anti-framing override for Adsterra invoke.js.
    Spoofs window.top, parent, and frameElement so invoke.js bids at full rate inside iframes.
    To disable: comment out or remove the <script> block below.
  -->
  <script>
    try {
      Object.defineProperty(window, 'top', { get: function() { return window.self; } });
      Object.defineProperty(window, 'parent', { get: function() { return window.self; } });
      Object.defineProperty(window, 'frameElement', { get: function() { return null; } });
    } catch (e) {}
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 160px;
      height: 300px;
    }
  </style>
</head>
<body>
  <!-- TODO: 在 Adsterra 后台创建 160x300 Banner 后，把 key 填到下面两处（atOptions.key 和 invoke.js URL），并到 src/site_config.ts 把 banner-160x300 的 enabled 改为 true -->
  <script type="text/javascript">
    atOptions = {
      'key': 'eb9708b5cb31992c442f10336754183f',
      'format': 'iframe',
      'height': 300,
      'width': 160,
      'params': {}
    };
  </script>
  <script type="text/javascript" src="https://www.highrevenueformat.com/eb9708b5cb31992c442f10336754183f/invoke.js"></script>
</body>
</html>
